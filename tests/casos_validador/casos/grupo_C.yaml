# Casos de prueba del validador — grupo C (etapa 5, ámbito cifra; etapas 8–10, ámbito respuesta). Analista independiente
# de casos, 10/10/2026. Escritos solo a partir del texto de reglas/reglas.json, sin mirar las implementaciones.
# Formato: contrato_validador.md §6. En las reglas de respuesta el caso trae `respuesta:` (cifras con base propia, cruces,
# texto, ficha) y `consulta:` (intencion_pregunta, nivel_pedido). R-ENC-11 trae a la vez la forma de cifra (comparacion,
# §2e) y la de respuesta, porque el contrato la menciona en los dos ámbitos. Las claves de `espera` distintas de
# dispara/accion/motivo/modo/objetivo (semaforo, test_cambio_significativo…) son documentales.
