# Conjunto de evaluación independiente del intérprete de preguntas (S2-02).
# Escrito según backlog/slice-2/evidencia/encargo_s2-02_evaluacion.md, sin leer curados/interprete/ ni src/pap/interprete/.
#
# Convenciones:
# - `esperado.consulta` va en la forma de la interpretación: sin anclas, sin pregunta_original ni idioma.
# - El lugar va tal cual lo escribió la persona en `territorio.texto` (sin el artículo ni la preposición que lo
#   preceden: «en el Callao» → «Callao»), o `{nacional: true}` cuando la persona habla de todo el país.
# - Cuando falta un valor que el código completa con un default, el valor queda fuera de `consulta` y se dice en `notas`:
#   sin periodo → periodo por defecto del motor (último año; serie completa en evolución);
#   sin intención → interprete.sin_intencion (nivel_actual); sin lugar → interprete.sin_lugar (aclara: nacional o escribir);
#   año relativo («el año pasado») → interprete.anios_relativos (aclara: ultimo o escribir).
# - Cuando la persona nombra el gasto junto con otro problema en un cruce o un efecto, el tema esperado es el del
#   sujeto de la pregunta: «¿cuánto se gastó…?» → gasto_publico (como q3.json); «¿bajó la anemia con el gasto?» → anemia.
# - Las cifras que aparecen en las preguntas engañosas no son datos: la consulta esperada las ignora.
entradas:

