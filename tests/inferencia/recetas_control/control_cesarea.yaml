# CONTROL DE PRUEBA (M1-07, tarea 6) — no es un indicador: no está en dim_indicador.yaml, no responde preguntas, no se marca `verificado` y no pasa por
# `pap inferencia validar-recetas` (vive aquí, no en curados/inferencia/recetas/). Comprueba el diseño de «nino» contra una cifra oficial de 2024:
# Nacimientos de los últimos cinco años por cesárea (M17 = 1) de las mujeres de 15 a 49 años; el hijo de la entrevistada con el peso de su madre. Convertirlo en indicador es una consulta al dueño. Lo carga tests/inferencia/test_m107_controles.py con el esquema de recetas.Receta.
# Las cifras por área (`doradas_area`, esquema recetas.DoradaCorte) van en este mismo archivo; la prueba las separa antes de validar la receta.
id: control_cesarea
version: 0.1.0
fecha: "2026-11-13"
descripcion: "Nacimientos de los últimos cinco años por cesárea (M17 = 1) de las mujeres de 15 a 49 años; el hijo de la entrevistada con el peso de su madre"
indicador_id: control_cesarea
encuesta: ENDES
unidad: nino
medida: proporcion
anios: [2024, 2024]
universo_analitico: nino_hijo_de_entrevistada
indicador:
  combinar: una
  condiciones:
