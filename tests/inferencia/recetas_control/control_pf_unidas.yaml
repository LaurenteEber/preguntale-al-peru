# CONTROL DE PRUEBA (M1-07, tarea 6) — no es un indicador: no está en dim_indicador.yaml, no responde preguntas, no se marca `verificado` y no pasa por
# `pap inferencia validar-recetas` (vive aquí, no en curados/inferencia/recetas/). Comprueba el diseño de «mujer» contra una cifra oficial de 2024:
# Mujeres actualmente unidas de 15 a 49 años que usan algún método de planificación familiar (V313 = folclórico, tradicional o moderno). Convertirlo en indicador es una consulta al dueño. Lo carga tests/inferencia/test_m107_controles.py con el esquema de recetas.Receta.
# Las cifras por área (`doradas_area`, esquema recetas.DoradaCorte) van en este mismo archivo; la prueba las separa antes de validar la receta.
