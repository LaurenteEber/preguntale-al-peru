# Programas sociales (alcance «programa_social» de la ronda 2, W2 v2 §3; decisión del dueño del 7/10/2026).
# Un programa social NO es un programa presupuestal: se identifica por su unidad ejecutora (nivel E) o, en los programas
# municipales, por su actividad (nivel M). Este alcance etiqueta los mismos soles que los conceptos y los temas por función:
# NO se suma con ellos (R-GASTO-08b). Origen: ronda2/w2_trazabilidad/ejemplo_v2/dim_programa_social_v2.csv y
# 02_programas_sociales_v2.py. El nombre que se muestra es el nombre propio vigente en el año (regla de implementación:
# el que estuvo vigente más días del año; si hubo cambio en el año, la etiqueta lo dice), con el del MEF entre paréntesis
# cuando difiere (R-GASTO-08). «desde» = fecha desde la que rige el nombre (AAAA, AAAA-MM o AAAA-MM-DD; un decreto rige
# desde el día siguiente a su publicación); null = por verificar. rotulo_fecha: mes → la etiqueta dice el mes («desde
# agosto de 2023») y no el día (decisión del dueño del 8/10/2026 para Llamkasun).
# linea_aparte (E3, 8/10/2026): gasto del programa que NO es gasto final (p. ej. transferencias a municipalidades) y que
# la respuesta muestra siempre en una línea aparte, sin sumarlo (vista v_programa_social_linea_aparte).
version: "1.1.0"
