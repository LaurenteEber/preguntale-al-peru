# Correcciones ortográficas del nombre que se muestra (nombre_mostrado de dim_ubigeo_historico).
# Decisión del dueño (T-02, 2/11/2026): la interfaz muestra los nombres con tildes y ñ en todo el proyecto.
# La base es el Directorio Nacional de Municipalidades 2025 del INEI (o la ley de creación, o el archivo propio para
# provincias y departamentos). Aquí solo se corrige la ORTOGRAFÍA (tilde, ñ, mayúscula de «del», signo mal escrito,
# abreviatura) y solo con evidencia en un documento oficial. No se cambia ningún nombre legal.
#
# nombre_fuente: lo que trae hoy la fuente base. Si la fuente cambia, la construcción falla (T-19) para revisar la fila.
# El emparejamiento entre fuentes no cambia: usa nombre_normalizado (sin tildes ni signos).
#
# Validado y SIN corrección (nombres iguales o distintos que no son error):
#   060506 «Santa Cruz de Toled»: es el nombre legal (Ley 15416, 29/01/1965, «Creando el distrito de Santa Cruz de
#     Toled»); la municipalidad usa «Toledo», que queda como nombre alterno para la búsqueda.
#   250201 Raimondi, 050707 San Francisco de Rivacayco, 010517 San Francisco del Yeso, 150712 San Pedro de Laraos,
#     100106 Quisqui: se mantiene la grafía del Directorio 2025 (la más reciente del INEI); las anteriores quedan como
#     nombres alternos.
#   «de La Capilla», «de Los Molinos», «de Los Olleros», «de La Legua», «Villa El Salvador»…: todas las fuentes coinciden
#     y el artículo es parte del topónimo.
