    -3,7286; -73,2419 en dim_ubigeo_historico), a 2,5 km de la de Iquitos (160101) y a 157 km de El Estrecho (160801). Los 10 establecimientos más
    cercanos (todos a menos de 155 m, entre ellos el Hospital Regional de Loreto 00000003) son de 160108, y
    00020822 «SEÑOR DE CACHUY» está en «AV. 28 DE JULIO N°1013», PUNCHANA, 160108. No hay red ni microrred.
  revisado_dueno: false
