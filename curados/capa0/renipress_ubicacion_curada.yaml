# GA-09 (ronda 3, 7/10/2026): ubicación curada de establecimientos RENIPRESS cuyo UBIGEO es un código escindido.
# 160109 «Putumayo» (Maynas) se dividió por la Ley 30186 (2014) en Putumayo 160801, Rosa Panduro 160802 y Yaguas 160804
# (https://andina.pe/agencia/noticia-promulgan-ley-crea-provincia-putumayo-departamento-loreto-504823.aspx): ya no se
# redirige automáticamente a 160801 (territorio.CODIGOS_ESCINDIDOS). Hasta la ronda 3, RENIPRESS redirigía 2
# establecimientos 160109 → 160801 y ninguno parece estar en el distrito de Putumayo (auditoría aud_ga09, H1).
# Criterio: un establecimiento se cura solo con evidencia del propio crudo RENIPRESS (dirección, coordenadas, red y
# microrred) y de dim_establecimiento_salud / dim_ubigeo_historico (vecinos y capitales). Lo no curado queda en la
# provincia 160800 (ubigeo_valido = False, en revision/renipress_ubigeo_invalido.csv).
# Revisión: 03_auditoria/ola0/pendientes_menores/implementacion/renipress_160109.csv
