# Cifras publicadas por el INEI que la estandarización debe reproducir (control de definiciones, R-ENC-18).
# Semilla de las «cifras doradas» del piloto. Valores en %, a 1 decimal. Citas en `fuentes` (auditoría S4, 9/10/2026:
# 03_auditoria/s4_insumos/auditoria.md). Las claves *_informativo no bloquean.
version: 1.1.0
tolerancia_pp: 0.1   # sobre la estimación redondeada a 1 decimal (equivale a < 0,15 pp)
notas:
  - "ENDES 2015: con el universo único (filtro de pernocte) la cifra nacional queda ~0,15 pp por debajo de lo publicado (43,35 frente a 43,5; DCI 14,25 frente a 14,4); los departamentos y el área rural se reproducen mejor así (H-03). Probablemente la publicación usó otra versión de la base."
  - "ENDES 2015–2017 no trae ubigeo: Lima solo a nivel de departamento (HV024 = 15), no «Provincia de Lima» (H-12)."
  - "ENAHO: en el ranking departamental, Lima Metropolitana = provincia 1501 (ambito_lima); en las tablas por área o dominio = dominio 8, Lima + Callao (lima_metropolitana_dominio8) (H-05)."
