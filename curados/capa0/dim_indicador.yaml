  definicion:
    filtro_universo: grupo_edad IN ('6-11m','12-23m','24-35m')
    cota_inf: SUM(filas) con LEFT(ubigeo_procedencia,2) = dpto / poblacion_6_35m(dpto, anio)
    cota_sup: cota_inf + SUM(filas) con ubigeo_procedencia IS NULL y LEFT(ubigeo_eess,2) = dpto / poblacion_6_35m(dpto, anio)
    denominador: fact_poblacion_grupo WHERE fuente_id='INEI-PROYECCIONES-DEPARTAMENTAL-EDAD' AND grupo_id='6-35m' AND nivel='departamento' AND sexo='T'
    semaforo: usa cota_sup (R-REG-07, R-CRUCES-09)
    cota_inf_ambito: SUM(filas) con ambitos_lima.ambito_por_ubigeo(ubigeo_procedencia) = ámbito / denominador_ambitos_lima
    cota_sup_ambito: cota_inf_ambito + SUM(filas) con ubigeo_procedencia IS NULL y ambitos_lima.ambito_por_ubigeo(ubigeo_eess) = ámbito / denominador_ambitos_lima
    aviso_margen: si 0 ≤ cota_inf − 50 < 1 → «apenas supera la mitad»; «más de la mitad» solo con cota_inf ≥ 50 (R-REG-07.sien_ambitos_lima, L7)
  rotulo_medida: niños con al menos una medición de hemoglobina en establecimientos del MINSA o del gobierno regional, de cada 100 niños de 6 a 35 meses del departamento (no equivale a toda la población
    atendida)
  rotulos_obligatorios:
  - «Entre {inf} y {sup} de cada 100 niños de 6 a 35 meses de {departamento} tuvieron al menos una medición de hemoglobina en {anio} en establecimientos del MINSA o del gobierno regional.»
  - 'Si el intervalo cruza el 50 %: «Con los datos disponibles no podemos decir si la cobertura supera o no la mitad de los niños.»'
  - 'Ficha: la cota superior no es estricta (no cuenta a niños sin procedencia del departamento atendidos en otros departamentos).'
  - 'LM y LR: el denominador se rotula «población estimada (cálculo propio)» (L7).'
  - 'Si 0 ≤ cota inferior − 50 < 1: «apenas supera la mitad» (2025: Lima Región, 50,6 %); «más de la mitad» solo si la cota inferior es ≥ 50 (L7).'
  notas:
  - 'Cobertura > 100 %: no truncar; 100–110 % referencial; > 110 % numerador y denominador (R-REG-08).'
  - 'No es un cruce: es el control de calidad del SIEN (R-REG-07); se muestra junto a la anemia en tamizados.'
