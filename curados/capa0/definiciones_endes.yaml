# Definiciones con que el INEI publica los indicadores de la ENDES del piloto (S4, 9/10/2026).
# Las aplica el motor (dim_indicador) sobre biblioteca/estandarizada/encuestas/endes_nino.parquet y las usan
# las pruebas de S4 para reproducir las cifras publicadas (cifras_control_inei.yaml).
# Verificado contra las cifras nacionales del INEI de 2015 a 2025 (tolerancia 0,1 pp).
version: 1.1.0  # 9/10/2026, tras la auditoría S4 (03_auditoria/s4_insumos/): sin excepción de 2015; estrato = departamento × HV022
diseno:
  peso: peso                 # peso_medicion en 2020 (HV005A, factor de las mediciones del año telefónico); peso_hogar (HV005/1e6) el resto
  estrato: id_estrato        # departamento (HV024) × HV022: en 2015–2017 HV022 solo tiene 3 valores que cruzan departamentos
  estratos_un_conglomerado: adjust  # R-ENC-01 (survey.lonely.psu = "adjust"; svy Singleton "center"). Hay 0–18 por año (revision/endes_etiquetas.csv)
  conglomerado: id_conglomerado  # HV021
  agrupar_anios: "año × estrato y año × conglomerado (R-ENC-10); los pesos están normalizados: no estimar totales"
indicadores:
  anemia_6_35m:
    descripcion: Niñas y niños de 6 a 35 meses con anemia (hemoglobina ajustada por altitud)
    variable: anemia_hist          # HC57 en 1–3; serie con el criterio vigente hasta 2023 (RM 363-2022-MINSA desde 2024)
    universo:
      edad_meses: [6, 35]
      hb_medida: true              # HC55 = 0
      variable_no_nula: true       # HC57 en 1–4
      pernocto: true               # HV103 = 1 (durmió en el hogar la noche anterior)
    # 2015: con el filtro de pernocte da 43,35 % (publicado 43,5) pero reproduce mejor los departamentos y el área rural;
    # se usa el mismo universo todos los años (H-03 de la auditoría S4)
  anemia_6_35m_oms2024:
    descripcion: Niñas y niños de 6 a 35 meses con anemia, nueva directriz OMS 2024 (RM 251-2024-MINSA)
    variable: anemia_oms2024       # HC57A en 1–3; solo desde 2024
    anios: [2024, null]
    universo: {edad_meses: [6, 35], hb_medida: true, variable_no_nula: true, pernocto: true}
  dci_menores_5:
    descripcion: Desnutrición crónica en menores de 5 años (patrón OMS, talla para la edad < −2 DE)
    variable: dci                  # haz < -2 (HC70/100)
    universo:
      edad_meses: [0, 59]
      haz_valido: true             # HC70 < 9990 (sin banderas 9996–9999 ni nulos)
      pernocto: true
    # 2015: con el filtro da 14,25 % (publicado 14,4); ver la nota de anemia_6_35m
