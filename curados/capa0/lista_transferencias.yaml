# Lista curada de la genérica 2.4 «Donaciones y transferencias» (GA-05, R-GASTO-05 v4) — v2 tras la auditoría aud_ga05;
# 2.1.0: EX-01 (centros poblados) y EX-02 (IVP, probable) aplicadas por decisión del dueño (7/10/2026), con alarma G-18b.
# Reemplaza la marca por patrón (GENERICA = '4' AND SUBGENERICA_DET = '3') de gasto.py.
# Llave: código completo del clasificador = TIPO_TRANSACCION.GENERICA.SUBGENERICA.SUBGENERICA_DET.ESPECIFICA.ESPECIFICA_DET
# (columna `clasificador_transferencia` de gasto_base_*). Toda específica 2.4 que aparezca en la base DEBE estar aquí:
# si no, la prueba G-15 falla y la construcción se detiene.
version: 2.1.0
fecha: '2026-10-07'
revisado_dueno: false
fuentes:
  clasificador_2023: https://www.mef.gob.pe/contenidos/presu_publ/anexos/2023/Anexo_2_Clasificador_Economico_Gastos_2023.pdf
  clasificador_2024: https://cdn.www.gob.pe/uploads/document/file/5627853/4986320-anexo-ii-clasificador-economico-de-gastos-para-el-ano-fiscal-2024.pdf
  clasificador_2025: https://cdn.www.gob.pe/uploads/document/file/7405290/6312586-anexo_2_rd0039_2024ef5001.PDF (Anexo 2 de la RD 0039-2024-EF/50.01,
    https://www.mef.gob.pe/en/por-instrumento/resolucion-directoral/33947-resolucion-directoral-n-0039-2024-ef-50-01/file)
  indice_mef: https://www.mef.gob.pe/es/clasificadores-presupuestarios
  transferencias_financieras_siaf: https://www.mef.gob.pe/contenidos/ogie/capacitacion/esquema_transferencia_financiera_19072017.pdf
  compras_ops_minsa: 'https://busquedas.elperuano.pe/dispositivo/NL/2316660-1/ (RM 555-2024/MINSA: CENARES transfiere a la OPS/OMS para comprar
    vacunas; DU 007-2019, art. 7)'
  nota_verificacion: Nombres tomados de ESPECIFICA_DET_NOMBRE del CSV del MEF (idénticos 2023–2025). La presentación DGCP 2014 corrobora 2.4.1.3.1.1
    a .4. El texto del Anexo 2 2023–2025 NO se pudo leer (cdn.www.gob.pe 403; el PDF del MEF se corta en la 2.3), ni por el analista ni por el
    auditor. revisado_dueno queda en false hasta que el dueño coteje el Anexo 2 de cada año desde otra red.
  presentacion_mef_2014: 'https://www.mef.gob.pe/contenidos/conta_publ/capacitaciones/seminario_dic2014/exposiciones/TRANSFERENCIAS_FINANCIERAS_CANORIO.pdf
    (DGCP, ejercicio 2014: lista 2.4.1.3.1.1–.4 con estos nombres y, como tipos de receptor, institutos viales provinciales, centros poblados,
    beneficencias, OPD municipales y empresas del Estado; no asigna receptor a código; no muestra .5)'
categorias:
  intergubernamental:
    letra: a
    descripcion: El receptor es un pliego o ejecutora que está en la base y vuelve a registrar el gasto (fuente 4, Donaciones y transferencias).
    consolidado_multinivel: excluir
    cifra_tematica: excluir
    cifra_de_un_solo_pliego: incluir_rotulado
  publico_fuera_de_base:
    letra: b
    descripcion: El receptor es una entidad pública que no está en la base (fondos con uso final conocido como el FEPC, empresas públicas, EPS,
      AGROBANCO, beneficencias; y, por decisión del dueño del 7/10/2026, centros poblados e IVP —este último rotulado «probable IVP»—). Nadie vuelve a registrar el gasto.
    consolidado_multinivel: bloque_rotulado
    cifra_tematica: excluir_y_mostrar_aparte
    cifra_de_un_solo_pliego: incluir_rotulado
  fondo_por_identificar:
    letra: b*
    descripcion: 'Transferencia a un fondo público cuyo uso final no se conoce y que podría financiar después a pliegos de la base (transferencia
      de partidas): posible doble conteo.'
    consolidado_multinivel: fuera_de_las_sumas_con_nota
    cifra_tematica: excluir
    cifra_de_un_solo_pliego: incluir_rotulado
  gasto_final_externo:
    letra: c
    descripcion: Pago a gobiernos extranjeros, organismos internacionales o fondos binacionales (cuotas, compras a través de la OPS/UNICEF/UNOPS).
      Es gasto final; nadie en la base lo vuelve a registrar.
    consolidado_multinivel: incluir
    cifra_tematica: incluir
    cifra_de_un_solo_pliego: incluir
  por_revisar:
    letra: d
    descripcion: Específica nueva o sin clasificar. La prueba G-15 falla si su devengado es mayor que cero.
    consolidado_multinivel: bloquear
    cifra_tematica: bloquear
    cifra_de_un_solo_pliego: bloquear
