alarmas_revision:
  descripcion: Filas intergubernamentales sin excepción aplicada cuyo NOMBRE de actividad sugiere un receptor fuera de la base. Solo avisan (G-18b);
    nunca clasifican. Con EX-01 y EX-02 aplicadas, la alarma lista lo que esas excepciones no cubren (otros códigos de actividad, otros niveles).
  patrones_nombre:
  - CENTRO POBLADO
  - CENTROS POBLADOS
  - CAMINOS VECINALES
  - INSTITUTO VIAL
  - BENEFICENCIA
