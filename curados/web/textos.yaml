# Textos de la web (S3-03, S3-04). Ninguno habla de la terminal: la web no muestra los textos de las excepciones ni los de la CLI.
# Todo texto visible de las páginas sale de aquí o de curados/motor/textos/capas.yaml (rotulos); nunca de HTML, JavaScript ni Python.
version: 1.1.0
preparando: &preparando "Estamos preparando el servicio… Intenta de nuevo en unos segundos."
version_rotulo: "Biblioteca {huella}, construida el {fecha}"
errores:                              # por tipo de excepción o código de ConsultaInvalida
  solicitud_invalida: "No pudimos leer tu pregunta. Escríbela de nuevo."
  texto_muy_largo: "Tu pregunta es demasiado larga. Hazla más corta."
  consulta_invalida: "No pudimos entender esa consulta. Revisa los datos que elegiste e inténtalo de nuevo."
  eleccion_invalida: "Esa opción ya no es válida. Haz la pregunta de nuevo y elige una de las opciones que te mostramos."
  error_interno: "Algo salió mal de nuestro lado. Inténtalo de nuevo en un momento."
  metodo_no_permitido: "Esta dirección solo acepta preguntas enviadas desde el formulario."
  no_encontrado: "No encontramos esa dirección."
  cuerpo_muy_grande: "Lo que enviaste es demasiado grande. Escribe una pregunta más corta."          # supuesto: S3-07
codigos_consulta: {}                  # texto propio por código de ConsultaInvalida (opcional; sin él, `consulta_invalida`)
rotulos_intenciones:
  nivel_actual: "¿Cuánto hay hoy?"
  evolucion: "¿Cómo ha cambiado?"
  comparacion: "Comparar dos lugares"
  identificar_extremo: "¿Dónde es más alto o más bajo?"
  efecto: "¿Cuánto influye?"
  cruce: "Cruzar con otra característica"
rotulos_temas:
  anemia: "Anemia infantil"
  desnutricion_cronica: "Desnutrición crónica infantil"
  pobreza_monetaria: "Pobreza monetaria"
  gasto_publico: "Gasto público"
rotulos_niveles:
  distrito: "Distrito"
  provincia: "Provincia"
  departamento: "Departamento"
  nacional: "Todo el Perú"
ejemplos:
  - "¿Qué tanta anemia tienen los niños de Moquegua?"
  - "¿Cómo ha cambiado la pobreza en Puno?"
  - "¿Cuánto gasta el Estado en Ucayali?"

# ---- S3-04: páginas -----------------------------------------------------------------------------------------------------
# Mensajes del intérprete (`tipo: mensaje`), por `motivo`. Son los textos fijos de curados/motor/textos/interprete.yaml sin la frase
# que manda a la terminal (`via_estructurada`); donde ofrecían las opciones, aquí va el enlace al formulario guiado.
mensajes:
  no_es_pregunta: "No encontramos una pregunta. Escribe qué quieres saber, de qué problema y de qué lugar; por ejemplo: «¿Cuánta anemia hay en Puno?»."
  otro_idioma: "Por ahora solo respondemos preguntas en español."
  no_entendida: "No entendimos la pregunta. ¿Puedes escribirla de otra forma?"
  no_disponible: "Ahora no podemos interpretar preguntas escritas. Puedes elegir las opciones paso a paso."          # supuesto: S3-04-c
  tope_diario: "Hoy ya no podemos interpretar más preguntas escritas. Puedes elegir las opciones paso a paso."       # supuesto: S3-04-c; motivo confirmado por S3-07
  espera_un_momento: "Espera unos segundos y vuelve a intentar."                                                                            # S3-07: límite por IP, mensaje fijo
  volver_a_preguntar: "Escribe la pregunta de nuevo con el lugar o el año que quieres saber."
  preparando: *preparando
  otro: "No pudimos responder esa pregunta. Inténtalo de nuevo."                                                 # supuesto: S3-04-c
paginas:
