  titulo_respuesta: "Respuesta"
  titulo_aclaracion: "Necesitamos un dato más"
  titulo_aviso: "Aviso"
  caja_etiqueta: "Escribe tu pregunta"
  caja_etiqueta_de_nuevo: "Escribe tu pregunta de nuevo"
  caja_ayuda: "Cuéntanos de qué problema y de qué lugar quieres saber: un departamento, una provincia o un distrito."
  boton_preguntar: "Preguntar"
  buscando: "Buscando…"
  ejemplos_titulo: "O toca un ejemplo"
  temas_hoy: "Temas de hoy:"
  fuentes_hoy: "Los datos salen de fuentes públicas oficiales: el INEI, el Instituto Nacional de Salud y el Ministerio de Economía y Finanzas."
  guiado_enlace: "Elegir paso a paso, sin escribir"
