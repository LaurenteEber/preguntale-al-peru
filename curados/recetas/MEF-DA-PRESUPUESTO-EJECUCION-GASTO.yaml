# Receta de obtención — generada desde el catálogo y editada a mano (S3: certificado del MEF vencido).
# Se puede editar a mano; `pap recetas generar` no la sobrescribe salvo con --sobrescribir.
# Esquema: src/pap/esquemas/receta.schema.json
id: MEF-DA-PRESUPUESTO-EJECUCION-GASTO
strategy: http_pattern
publisher: MEF
dataset_title: Presupuesto y Ejecución de Gasto (datos abiertos MEF)
access_url: https://www.datosabiertos.gob.pe/dataset/presupuesto-y-ejecuci%C3%B3n-de-gasto
url_patron: https://fs.datosabiertos.mef.gob.pe/datastorefiles/{anio}-Gasto.csv
documentation_url: https://fs.datosabiertos.mef.gob.pe/datastorefiles/Gastos_Diccionario.csv
temporal:
  inicio: 2012
  fin: 2026
spatial:
  ambito: PE
  nivel_minimo: distrito
source_version:
  basis: ninguna
data_cutoff:
  basis: desconocida
licenses:
- name: otra-abierta
  title: Otro (abierto)
license_basis: declarada_en_pagina
known_issues:
- 'El ubigeo distrital es el de la SEDE DE LA UNIDAD EJECUTORA; la meta solo trae DEPARTAMENTO_META. Atribuir a
  distrito solo el gasto de municipalidades (NIVEL_GOBIERNO=M) o inversiones ubicadas por CUI en MEF-DETALLE-INVERSIONES;
  el gasto del Gobierno Nacional y Regional va a departamento por DEPARTAMENTO_META. Las transferencias se registran
  de nuevo como gasto del receptor: no sumarlas. Construir el ubigeo como DEPARTAMENTO(2)+PROVINCIA(2)+DISTRITO(2)_EJECUTORA
  y validarlo contra la tabla INEI.'
espera:
  formato:
  - csv
pendientes:
- 'Certificado HTTPS de fs.datosabiertos.mef.gob.pe vencido (6/10/2026): descargar 2023-Gasto.csv, 2024-Gasto.csv y 2025-Gasto-Mensual.csv con el navegador; ver docs/guias/descarga_mef.md'
catalogo:
  ola: 1_nucleo
  estrategia_descarga: descarga_directa_url
  compuerta_ingesta: aprobada
  bloquea_mvp: true
notas: 'Archivo anual {anio}-Gasto.csv para 2012–2024; para 2025–2026 usar SOLO {anio}-Gasto-Mensual.csv (nunca
  sumar -Mensual y -Diario: duplica). CUI = PRODUCTO_PROYECTO cuando TIPO_ACT_PROY indica proyecto.'
