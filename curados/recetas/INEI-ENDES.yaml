# Receta de obtención — generada desde catalogo/catalogo_fuentes.json con `pap recetas generar`.
# Se puede editar a mano; `pap recetas generar` no la sobrescribe salvo con --sobrescribir.
# Esquema: src/pap/esquemas/receta.schema.json
id: INEI-ENDES
strategy: http_pattern
publisher: INEI
dataset_title: Encuesta Demográfica y de Salud Familiar
access_url: https://proyectos.inei.gob.pe/microdatos/
url_patron: https://proyectos.inei.gob.pe/iinei/srienaho/descarga/{formato}/{codigo}-Modulo{modulo}.zip
documentation_url: https://proyectos.inei.gob.pe/iinei/srienaho/Descarga/DocumentosMetodologicos/2024-5/FichaTecnica.pdf
temporal:
  inicio: 1986
  fin: 2025
spatial:
  ambito: PE
  nivel_minimo: manzana_conglomerado
source_version:
  basis: ninguna
data_cutoff:
  basis: desconocida
licenses:
- name: ODbL-1.0
  title: ODbL (en datosabiertos.gob.pe) / uso libre con cita
license_basis: declarada_en_pagina
known_issues:
- 'Muestra 2024: 36 760 viviendas; inferencia anual departamental (24 + Callao) y por área/región; no provincial/distrital.
  Algunos indicadores (anemia) con IC amplios en dptos pequeños. Cambio de umbral de anemia por altitud (OMS 2024)
  puede generar quiebre de serie; verificar en informe. Ubigeo y conglomerado presentes pero geo-desplazado en versiones
  DHS internacionales.'
espera:
  formato:
  - zip
  - sav
  - dta
  - csv
  - pdf
catalogo:
  ola: 1_nucleo
  estrategia_descarga: descarga_directa_url
  compuerta_ingesta: aprobada
  bloquea_mvp: false
pendientes:
- Definir cómo se eligen los valores del patrón (ver notas).
notas: 'Módulos por cuestionario (RECH0, RECH1, REC0111, REC21, REC42, RECH6 antropometría/anemia, CSALUD01...).
  Código de tipo de encuesta en docs = 5 (.../DocumentosMetodologicos/2024-5/). También en datosabiertos.gob.pe
  (ZIP completo + diccionarios). Portal ASP clásico. Flujo AJAX: CambiaEnc.asp (encuesta→años) → CambiaAnio.asp
  (año→periodos) → cambiaPeriodo.asp (periodo→tabla de módulos con links). Descarga directa predecible: https://proyectos.inei.gob.pe/iinei/srienaho/descarga/{SPSS|STATA|CSV|DBF}/{codigo_encuesta_anio}-Modulo{codigo_modulo}.zip
  (ej. ENAHO 2024 = 966-Modulo01.zip). Ficha técnica: https://proyectos.inei.gob.pe/iinei/srienaho/Descarga/FichaTecnica/{codigo_encuesta_anio}-Ficha.pdf.
  Documentos metodológicos: .../Descarga/DocumentosMetodologicos/{AÑO}-{codigo_tipo_encuesta}/{archivo}.pdf. Nombres
  de encuesta con caracteres Windows-1252 deben codificarse con escape() de JS (%96), no UTF-8. Sin captcha ni registro
  conocidos. Bash del entorno no tuvo salida a *.inei.gob.pe (proxy 403): probar desde otro entorno.'
