notas: 'Códigos de encuesta-año confirmados: 2019=687 (ficha técnica 687), 2023=906, 2024=966 (resto: obtener de
  cambiaPeriodo.asp o tablas de enahodata/PeruData); 1997–2003 en DBF. Módulos corte transversal: 01 vivienda/hogar,
  02 miembros, 03 educación, 04 salud, 05 empleo e ingresos, 34 sumarias (pobreza), 85 gobernabilidad, 37 programas
  sociales, etc. URL: .../descarga/{STATA|SPSS|CSV}/{cod}-Modulo{NN}.zip. Docs: .../DocumentosMetodologicos/{AÑO}-55/
  (p.ej. 6_Calidad-ENAHO.pdf, 20_Diccionario_2024.pdf). Portal ASP clásico. Flujo AJAX: CambiaEnc.asp (encuesta→años)
  → CambiaAnio.asp (año→periodos) → cambiaPeriodo.asp (periodo→tabla de módulos con links). Descarga directa predecible:
  https://proyectos.inei.gob.pe/iinei/srienaho/descarga/{SPSS|STATA|CSV|DBF}/{codigo_encuesta_anio}-Modulo{codigo_modulo}.zip
  (ej. ENAHO 2024 = 966-Modulo01.zip). Ficha técnica: https://proyectos.inei.gob.pe/iinei/srienaho/Descarga/FichaTecnica/{codigo_encuesta_anio}-Ficha.pdf.
  Documentos metodológicos: .../Descarga/DocumentosMetodologicos/{AÑO}-{codigo_tipo_encuesta}/{archivo}.pdf. Nombres
  de encuesta con caracteres Windows-1252 deben codificarse con escape() de JS (%96), no UTF-8. Sin captcha ni registro
  conocidos. Bash del entorno no tuvo salida a *.inei.gob.pe (proxy 403): probar desde otro entorno.'
