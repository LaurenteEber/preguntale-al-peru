# Receta de obtención — generada desde catalogo/catalogo_fuentes.json con `pap recetas generar`.
# Se puede editar a mano; `pap recetas generar` no la sobrescribe salvo con --sobrescribir.
# Esquema: src/pap/esquemas/receta.schema.json
id: MEF-SEGUIMIENTO-PI
strategy: http_pattern
publisher: MEF
dataset_title: Seguimiento de Proyectos de Inversión (datos abiertos MEF)
access_url: https://www.datosabiertos.gob.pe/dataset/seguimiento-de-proyectos-de-inversi%C3%B3n
url_patron: https://fs.datosabiertos.mef.gob.pe/datastorefiles/{anio}-Seguimiento-PI.csv
temporal:
  inicio: 2014
  fin: 2026
spatial:
  ambito: PE
  nivel_minimo: distrito
source_version:
  basis: ninguna
data_cutoff:
  basis: desconocida
licenses:
- name: otra-abierta
  title: Otra (abierta) según PNDA
license_basis: declarada_en_pagina
known_issues:
- 'Sin CODIGO_SNIP ni ubigeo del proyecto: el CUI viene en PRODUCTO_PROYECTO y el ubigeo es el de la ejecutora.
