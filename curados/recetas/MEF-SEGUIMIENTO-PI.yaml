catalogo:
  ola: 1_nucleo
  estrategia_descarga: descarga_directa_url
  compuerta_ingesta: aprobada
  bloquea_mvp: false
pendientes:
- Definir cómo se eligen los valores del patrón (ver notas).
notas: 13 CSV anuales (p.ej. recurso 2020-Seguimiento-PI.csv, id 9a66b3ce-0e39-4e32-9fb4-b6b6266ee6c4) + Seguimiento_PI_Diccionario.csv;
  las URLs de archivo están en fs.datosabiertos.mef.gob.pe/datastorefiles/. Obtener la lista de recursos desde la
  página del dataset (Drupal DKAN del PNDA) y bajar cada CSV.
