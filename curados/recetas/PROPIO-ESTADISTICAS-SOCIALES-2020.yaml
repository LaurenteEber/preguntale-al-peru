known_issues:
  - Compilación propia de 2020; las fuentes primarias se declaran por columna en las notas al pie.
  - La fila 159999 «Región Lima» es el ámbito Lima Región (9 provincias del departamento de Lima sin la provincia de Lima), no un distrito.
  - Nombres con tildes corregidas por el autor respecto a la forma oficial del INEI.
  - Coordenadas de la capital del distrito, no del centro del territorio.
  - Densidad calculada con la proyección 2019; no usar.
