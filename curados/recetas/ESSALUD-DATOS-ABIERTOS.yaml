  Abiertos (Drupal/DKAN). Cada dataset tiene recursos con URL de descarga en /sites/default/files/... o enlaces
  externos; se puede listar vía /api/3/action/package_show?id=<slug> (API CKAN-compatible de DKAN; confirmar). Desde
  este entorno el portal devolvió 403/robots en fetch: probar con navegador/Playwright.'
