# Plantilla cruce_efecto: dos cifras lado a lado (CR-01, R-03) y, si se pregunta «¿sirvió?», la estructura de efecto
# en 5 partes (R-CRUCES-07): qué se gastó, qué cambió, y por qué no se puede decir que uno causó lo otro.
version: 1.0.0
efecto:
  corta: ["{{p:no_sirvio}}"]
  corta_cifra: "Lo que sí se sabe es lo gastado {nivel_en}:"
  ojo: ["{{p:no_concluir_gasto}}"]
  tarjeta_final:
    titulo: "Qué haría falta para saber si sirvió"
    texto: "{{p:efecto}} {{p:evaluaciones}}"
  nc: [["NC-EFICIENCIA", {}]]
  protegidos:
    no_sirvio: "No se puede saber si {gasto_contra} sirvió en {lugar}: no encontramos una evaluación publicada."
    no_concluir_gasto: "No concluyas que el gasto funcionó o falló: estas cifras no permiten saberlo."
    efecto: "@frase:efecto"
    evaluaciones: "No encontramos una evaluación publicada de estos servicios para {lugar_largo}. Para saberlo haría falta comparar a niños que recibieron los servicios con niños parecidos que no los recibieron."
cruce:
  corta: ["Estas cifras se muestran lado a lado: {sujeto_a} y {sujeto_b}. No muestran si una causa la otra."]
  corta_cifra: "Esto es lo que se gastó {nivel_en}:"
  ojo: ["{{p:no_concluir_cruce}}"]
  tarjeta_final: null
  nc: []
  protegidos:
    no_concluir_cruce: "No concluyas que una cifra explica la otra: se muestran juntas, no se comparan."
tarjetas:
  endes:                          # la cifra b del cruce (anemia de la encuesta) en el territorio donde existe
    titulo: "Anemia en {lugar} (encuesta a hogares)"
    texto: "Para {lugar_completo} se estima que {c} de {{u:ninos}} tenía anemia ({fuente})."
    cambio: " Entre {a} y {b}, en {lugar}, la anemia {verbo}."
    sin_nivel_fino: " La encuesta no da cifras por {nivel_palabra}."
  mismo_anio:                     # X-03: el gasto del mismo año que la cifra comparada
    titulo: "Gasto en {lugar} en {anio}"
    texto: "En {anio}, el gasto en {lugar} fue {c} ({fuente}): el mismo año con el que se compara la anemia."
    etiqueta: "Otro año: no se suma ni se compara con la cifra clave."
etiqueta_otro_territorio: "Otro territorio: no se suma ni se compara con la cifra clave."
