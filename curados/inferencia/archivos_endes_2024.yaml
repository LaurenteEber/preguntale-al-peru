citas:
  doc11_hhid: "Documento n.º 11, «Precisiones»: «HHID: Identificación a nivel hogar. HHID = HV001 (conglomerado) + HV002 (vivienda) + HV002A (hogar)»; la tabla de identificadores da HHID como identificador principal de RECH0, RECH23 y Programas Sociales x Hogar, y como primer componente de las demás tablas de hogar."
  doc11_hvidx: "Documento n.º 11, «Precisiones»: «HVIDX: Identificación de número de línea del entrevistado(a)» y HVIDX = IDXH4 = B16 = HA0 = HC0 = QSNUMERO = QS801; la tabla da HHID + HVIDX para RECH1 y los PS_*."
  doc11_caseid: "Documento n.º 11, «Precisiones»: «CASEID: Identificación a nivel mujer»; la tabla da CASEID como identificador principal de REC0111, RE223132, REC42, RE516171, RE758081, REC84DV y REC91, y CASEID + el índice del hijo (BIDX = MIDX = HIDX = HWIDX = IDX94 = IDX95 = QCOL93) para las tablas por hijo."
  solo_datos: "El documento n.º 11 no menciona esta unión (V003, número de línea de la entrevistada); queda comprobada solo contra los datos (REC0111 → RECH1: todas las filas encuentran su pareja)."
