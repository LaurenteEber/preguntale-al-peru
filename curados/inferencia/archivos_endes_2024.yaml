# Archivos de la ENDES 2024: unidad, llave y uniones declaradas (M0-05, tarea 5; diseño §7.1 y anexo A).
# Lo escribe una persona leyendo los diccionarios del INEI (PDF dentro de cada ZIP 968-ModuloNNNN, recursos endes-2024-diccionario-*)
# y la ficha técnica (recurso endes-2024-ficha-tecnica); el índice (`pap variables indexar`) lo copia a `archivos.parquet`
# (columnas `unidad`, `llave`, `relaciones`) y las pruebas lo verifican contra los datos: la llave no se repite en ningún
# archivo (tests/inferencia/test_indice_regresion.py) y cada unión declarada, hecha como unión izquierda del hijo con el
# padre, deja el mismo número de filas que el hijo (sin pérdida ni duplicación; el padre no repite la llave).
# `unidad`: qué es una fila (vocabulario de este archivo, supuesto M0-05): hogar, persona_del_hogar, mujer, hijo_de_mujer,
#   hermano_de_mujer, columna_de_calendario, persona_de_15_a_mas (la persona de 15 años a más seleccionada para el cuestionario de
#   salud: una por hogar; C-M1-06-1).
# `llave`: columnas que identifican una fila. HHID de los módulos de la mujer es el derivado de CASEID (clases_columnas.yaml).
# `relaciones`: hijo → padre, `por` = pares [columna del hijo, columna del padre], `cardinalidad` (M1-03; vocabulario en
#   tablas_curadas.CARDINALIDADES, lo comprueba `pap inferencia validar-tablas`):
#   - n:1 = varias filas del hijo por cada una del padre (siempre se une del hijo hacia el padre);
#   - 1:1 = el hijo tiene exactamente una fila por cada una del padre (RECH23–RECH0: 37 390 filas en ambas);
#   - 1:0..1 = el hijo tiene como máximo una fila por cada una del padre, pero no todas (REC42, RE223132, RE516171 y RE758081 frente a
#     REC0111: 34 252 de 37 117). Las filas del padre sin pareja quedan con el corte «sin dato» y cuentan para el control de pérdida de u.
#   Solo 1:1 y 1:0..1 permiten ir de un hijo a otro hijo del mismo padre (el verificador baja un solo nivel desde el padre común y arma
#   dos uniones izquierdas: A → padre → B). `verificador.comprobar_cardinalidades` lo comprueba contra los Parquet.
#   Medido el 12/11/2026 y no declarado (no hace falta todavía): REC91–REC0111 es 1:1 (37 117); REC84DV, CSALUD01 y
#   Programas_Sociales_x_Hogar son 1:0..1 (34 252 de 37 117; 34 018 de 37 390 las dos últimas). CSALUD01 → RECH1 se declara n:1 por
#   decisión del dueño (C-M1-06-1); en los datos cada persona de RECH1 tiene a lo sumo una fila en CSALUD01.
# Una unión que dejaría filas sin pareja NO se declara: REC93DVdisciplina no se une a REC0111 por CASEID (341 de sus
# 15 462 filas no tienen a esa mujer en REC0111; consultas_al_dueno.md, C-M0-05-2); sí a RECH0 por HHID.
# M1-06 (tarea 5, versión 0.3.0): `citas` y `llaves_cita` citan el documento n.º 11 del INEI «Identificadores de las bases de datos» (recurso
# endes-2024-identificadores-bd; PDF «2024-5-Ident-de-las-bd.pdf», 2 páginas: una tabla de 34 filas con los identificadores principales y
# alternos, y las «Precisiones») para las llaves y las uniones; cada unión lleva en `cita` la clave de `citas` que la respalda. Las llaves y
# uniones se siguen comprobando contra los datos (prueba de este archivo). Resultado de la lectura (evidencia/m1-06_identificadores.md):
# las 34 tablas coinciden con el documento salvo la unión REC0111 → RECH1 por V003, que el documento no menciona (queda `solo_datos`).
# Versión 0.4.0 (C-M1-06-1 y C-M1-02-2, dueño, 13/11/2026): CSALUD01 es una persona (la de 15 años a más seleccionada), con la llave del
# documento (HHID + QSNUMERO) y la unión a su fila de RECH1 (QSNUMERO = HVIDX); antes se declaraba hogar con llave HHID.
