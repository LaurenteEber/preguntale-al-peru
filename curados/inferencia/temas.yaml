# Temas y subtemas provisionales (M1-06 tarea 1; docs/diseno/fichas.md §8).
# Propuestos por el supervisor con las etiquetas de las variables, el 12/11/2026. Criterio: asuntos de la vida de las personas, no
# sectores del Estado. `estado: provisional` hasta que el dueño apruebe la taxonomía; cambiar la taxonomía es editar este archivo y
# reasignar los bloques (`curados/inferencia/bloques/`), no cambia ninguna cifra. Cada bloque nombra un tema y un subtema de aquí
# (`pap fichas validar`, regla 3).
# Agregados a lo que dice fichas.md §8 porque los bloques de las tablas del lote los necesitan (supuesto M1-06-s1; reversible, es editar
# este archivo): el tema `identificacion_encuesta` y `trabajo`, y los subtemas `discapacidad_infantil`, `alimentacion_infantil`
# (salud_infantil), `discapacidad` (salud_adultos), `barreras_acceso` y `uso_servicios` (acceso_salud), `juntos` (programas_sociales)
# y `documentos_identidad` (identidad_cultura).
