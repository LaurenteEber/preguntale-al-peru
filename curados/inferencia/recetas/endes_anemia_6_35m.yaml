encuesta: ENDES
unidad: nino
medida: proporcion
anios: [2024, 2024]
universo_analitico: nino_hecho_hb_medida
indicador:
  combinar: una
  condiciones:
    - {archivo: RECH6, variable: HC57, op: en, valores: [1, 2, 3]}
universo:
  restricciones:
    - {archivo: RECH6, variable: HC1, op: entre, valores: [6, 35]}
    - {archivo: RECH6, variable: HC57, op: en, valores: [1, 2, 3, 4]}
transformaciones: []
cortes_permitidos: [area, sexo]
cortes_no_permitidos:
  - {id: grupo_edad, motivo: "C-M0-06-2: ningún documento define los tramos de edad de los niños; el verificador lo rechaza mientras esté pendiente"}
  - {id: region_natural, motivo: "C-M0-06-3: ¿Costa = Lima Metropolitana + resto de la Costa?; además no hay unión declarada RECH6 → RECH23 (las dos cuelgan de RECH0 por HHID)"}
  - {id: quintil_riqueza, motivo: "C-M0-06-4: no se sabe si HV270 es el quintil de la ENDES 2000 o el del año; además no hay unión declarada RECH6 → RECH23 (las dos cuelgan de RECH0 por HHID)"}
tolerancia_pp: 0.1        # E-05: las cifras de la ENDES se reproducen a ± 0,1 pp (R-ENC-18)
fuente: "curados/capa0/definiciones_endes.yaml:13-22 (anemia_6_35m: variable anemia_hist = HC57 en 1–3; universo 6–35 meses, hb_medida HC55 = 0, HC57 en 1–4, pernocto HV103 = 1); src/pap/capa0/encuestas.py:148 (HC1), :150 y :165 (hb_medida = HC55 == 0), :154 (HC57 en 1–4) y :166-168 (anemia_hist = nivel ≤ 3); curados/inferencia/universos_analiticos.yaml (nino_hecho_hb_medida: HV103 = 1 y HC55 = 0)"
