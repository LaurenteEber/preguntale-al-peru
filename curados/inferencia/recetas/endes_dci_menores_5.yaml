# Receta de indicador (M0-10; diseño §8.1): la definición oficial que el motor ejecuta por el camino nuevo (plan → verificador → ejecutor →
# compuertas). Las variables son las que el INEI ya entrega ajustadas, así que `transformaciones` va vacío. Cada `var` se escribe como
# archivo + variable; el año lo pone `Receta.a_plan` (esta receta solo vale para `anios`). Esquema: src/pap/inferencia/recetas.py.
# estado: revisado + pendiente: visto_dueno. «verificado» lo da el visto del dueño (K-03) sobre las tres comprobaciones de M0-10
# (igualan al cubo, reproducen las doradas de 2024 y visto), no el agente.
id: endes_dci_menores_5
version: 0.1.0
fecha: "2026-11-09"
descripcion: "Desnutrición crónica en menores de 5 años (patrón OMS 2006): talla para la edad a menos de 2 desviaciones estándar, HC70 < −200 (centésimas de DE)."
indicador_id: endes_dci_menores_5
encuesta: ENDES
unidad: nino
medida: proporcion
anios: [2024, 2024]
universo_analitico: nino_hecho
indicador:
  combinar: una
  condiciones:
    - {archivo: RECH6, variable: HC70, op: "<", valores: [-200]}
universo:
  restricciones:
    - {archivo: RECH6, variable: HC1, op: entre, valores: [0, 59]}
    - {archivo: RECH6, variable: HC70, op: entre, valores: [-9989, 9989]}
transformaciones: []
cortes_permitidos: [area, sexo]
cortes_no_permitidos:
  - {id: grupo_edad, motivo: "C-M0-06-2: ningún documento define los tramos de edad de los niños; el verificador lo rechaza mientras esté pendiente"}
  - {id: region_natural, motivo: "C-M0-06-3: ¿Costa = Lima Metropolitana + resto de la Costa?; además no hay unión declarada RECH6 → RECH23 (las dos cuelgan de RECH0 por HHID)"}
  - {id: quintil_riqueza, motivo: "C-M0-06-4: no se sabe si HV270 es el quintil de la ENDES 2000 o el del año; además no hay unión declarada RECH6 → RECH23 (las dos cuelgan de RECH0 por HHID)"}
tolerancia_pp: 0.1        # E-05: las cifras de la ENDES se reproducen a ± 0,1 pp (R-ENC-18)
tolerancia_cv: 0.1        # cifras_doradas.csv: el INEI publica también el CV de la DCI
fuente: "curados/capa0/definiciones_endes.yaml:28-34 (dci_menores_5: variable dci = haz < −2; universo 0–59 meses, haz_valido HC70 < 9990, pernocto HV103 = 1); src/pap/capa0/encuestas.py:148 (HC1), :157 (HC70 válido de −9989 a 9989, en centésimas de DE) y :169-170 (haz_valido y dci = haz < −2); curados/inferencia/universos_analiticos.yaml (nino_hecho: HV103 = 1)"
doradas:
  - id_cifra: DOR-DCI-2024-PE
    nivel: nacional
    territorio: PE
    valor_publicado: 12.1
    decimales: 1
    bloqueante: true
    casos_publicados: 19511
    cv_publicado: 2.8
    cita: "INEI, Indicadores de Resultados de los Programas Presupuestales, ENDES 2024, Cuadro 04 p. 49; https://proyectos.inei.gob.pe/endes/2024/ppr2/Indicadores_de_Resultados_de_los_Programas_Presupuestales_ENDES_2024.pdf"
  - id_cifra: DOR-DCI-2024-URBANO
    nivel: dominio_subnacional
    territorio: urbano
    valor_publicado: 8.5
    decimales: 1
    bloqueante: true
    casos_publicados: 13565
    cv_publicado: 3.7
    cita: "INEI, Indicadores de Resultados de los Programas Presupuestales, ENDES 2024, Cuadro 04 p. 49; https://proyectos.inei.gob.pe/endes/2024/ppr2/Indicadores_de_Resultados_de_los_Programas_Presupuestales_ENDES_2024.pdf"
  - id_cifra: DOR-DCI-2024-RURAL
    nivel: dominio_subnacional
    territorio: rural
    valor_publicado: 20.9
    decimales: 1
    bloqueante: true
    casos_publicados: 5946
    cv_publicado: 3.9
    cita: "INEI, Indicadores de Resultados de los Programas Presupuestales, ENDES 2024, Cuadro 04 p. 49; https://proyectos.inei.gob.pe/endes/2024/ppr2/Indicadores_de_Resultados_de_los_Programas_Presupuestales_ENDES_2024.pdf"
estado: revisado
pendiente: visto_dueno
