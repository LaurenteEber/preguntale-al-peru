# Unidades de las tablas del lote de M1 (M1-07, tarea 2; diseño §7.4 y §12.1): por cada tabla, la unidad del plan que sus filas representan,
# la unidad que le declara el índice, su tabla base y de dónde sale su peso. El verificador elige el universo analítico, la tabla de la que
# parte el plan y el diseño por la **tabla que interviene** en el plan (no por el primer archivo de la unidad).
# - `unidad_plan`: el vocabulario de `Plan.unidad` (nino, mujer, hogar, persona; `tablas_curadas.UNIDADES_PLAN`).
# - `unidad_archivo`: la de `archivos_endes_2024.yaml` (persona_del_hogar, hijo_de_mujer, mujer, hogar); `pap inferencia validar-tablas` comprueba
#   que coincida. Las dos no son la misma cosa: RECH6 es una persona del hogar para el índice y un niño para el plan, y los cortes del niño
#   (cortes_estandar.yaml: sexo, grupo de edad) llevan `unidad: nino`; ese desajuste (nota de C-M1-06-1) se resuelve aquí y no renombrando
#   la unidad del corte, que es la que se empareja con la unidad de la receta. Un corte vale para un plan si su unidad es la del plan, la del
#   hogar o la de la tabla del corte según este archivo (`tablas_curadas.corte_aplica`).
# - `tabla_base`: la tabla de la que parte un plan cuando esta tabla interviene (debe ser de la misma unidad del plan). Hoy cada tabla del lote
#   parte de sí misma: sus filas son la unidad (una por niño, mujer, hogar o persona de su cuestionario) y las demás se le unen. Si un plan junta
#   dos tablas de la unidad, parte de la primera (por nombre) desde la que se alcanza a la otra por una unión declarada; si ninguna, el plan falla.
# - `peso`: la variable (se divide entre 1e6) y el archivo donde está; tiene que ser la propia tabla o un padre de las uniones para el diseño de
#   su fila de diseno_muestral.csv, y esa fila tiene que usar la misma variable (lo comprueba `validar-tablas`).
# - `solo_puente` (C-M1-07-2, dueño 13/11/2026): la tabla solo sirve de puente (sexo, edad, sobrevivencia y línea del niño hacia las demás tablas del hijo);
#   un plan cuyas tablas de la unidad son todas puentes se rechaza, y el plan nunca parte de ella. REC21 trae los 60 693 hijos que la mujer tuvo alguna vez.
# - `alternativa_medicion` (C-M1-07-3, dueño 13/11/2026): para un indicador de solo medición (talla, peso, hemoglobina) el motor prefiere `tabla`
#   (RECH6) a esta; la tabla solo se usa si el plan necesita una variable de la madre o del hijo de la entrevistada. `desde` y `hacia` son los
#   prefijos que emparejan las variables de las dos tablas (HW57 de REC44 = HC57 de RECH6).
# Quedan fuera del lote (sin fila aquí ni en la lista del planificador): REC82, REC83, REC84DV, REC93DVdisciplina, RECHM, CSALUD01, CSALUD08 y los programas
# sociales (cada ficha dice por qué). RECH5 entró con el factor hogar por decisión del dueño (C-M1-07-1, 13/11/2026).
version: 0.2.0
fecha: "2026-11-13"
unidades:
  - archivo: RECH0
    encuesta: ENDES
    anios: [2024, 2024]
    unidad_plan: hogar
    unidad_archivo: hogar
    tabla_base: RECH0
    peso: {variable: HV005, en: RECH0}
    cita: >-
      Ficha técnica ENDES 2024 (recurso endes-2024-ficha-tecnica), §VI p. 11 «Factor Hogar (HV005) … se utiliza para el cálculo de los indicadores que están relacionados al hogar» y «se encuentra en el módulo RECH0»; §5.2 p. 9 «A. Cuestionario del Hogar»
  - archivo: RECH23
    encuesta: ENDES
    anios: [2024, 2024]
    unidad_plan: hogar
    unidad_archivo: hogar
    tabla_base: RECH23
    peso: {variable: HV005, en: RECH0}
    cita: >-
      Ficha técnica ENDES 2024 (recurso endes-2024-ficha-tecnica), §VI p. 11 «Factor Hogar (HV005) … se utiliza para el cálculo de los indicadores que están relacionados al hogar» y «se encuentra en el módulo RECH0»; §5.2 p. 9 «A. Cuestionario del Hogar»; RECH23 (riqueza y región natural) es de la misma unidad que RECH0 (1:1)
  - archivo: RECH1
    encuesta: ENDES
    anios: [2024, 2024]
    unidad_plan: persona
    unidad_archivo: persona_del_hogar
    tabla_base: RECH1
    peso: {variable: HV005, en: RECH0}
    cita: >-
      Ficha técnica ENDES 2024 (recurso endes-2024-ficha-tecnica), §VI p. 11 «Factor Hogar (HV005) … se utiliza para el cálculo de los indicadores que están relacionados al hogar» y «se encuentra en el módulo RECH0»; §5.2 p. 9 «A. Cuestionario del Hogar»; los miembros del hogar son del cuestionario del hogar (supuesto M1-07-s1: la ficha no los nombra y el factor hogar es el único que asocia a ese cuestionario)
  - archivo: RECH4
    encuesta: ENDES
    anios: [2024, 2024]
    unidad_plan: persona
    unidad_archivo: persona_del_hogar
    tabla_base: RECH4
    peso: {variable: HV005, en: RECH0}
    cita: >-
      Ficha técnica ENDES 2024 (recurso endes-2024-ficha-tecnica), §VI p. 11 «Factor Hogar (HV005) … se utiliza para el cálculo de los indicadores que están relacionados al hogar» y «se encuentra en el módulo RECH0»; §5.2 p. 9 «A. Cuestionario del Hogar»; mismo supuesto M1-07-s1 que RECH1 (RECH4 es la misma persona, HVIDX = IDXH4)
  - archivo: RECH6
    encuesta: ENDES
    anios: [2024, 2024]
    unidad_plan: nino
    unidad_archivo: persona_del_hogar
    tabla_base: RECH6
    peso: {variable: HV005, en: RECH0}
    cita: >-
      Ficha técnica ENDES 2024 (recurso endes-2024-ficha-tecnica), p. 9 «Registro de la medición antropométrica (peso y talla) en niños menores de 6 años» y «Registro de los niveles de hemoglobina niños de 4 meses a menores de 6 años»; §VI p. 11 «Factor Hogar (HV005) … se utiliza para … desnutrición y anemia en menores de 5 años». El índice declara la fila como persona del hogar (archivos_endes_2024.yaml) y los cortes del niño (sexo, grupo de edad) llevan `unidad: nino`: ambas unidades se emparejan aquí, sin renombrar la del corte
  - archivo: RECH5
    encuesta: ENDES
    anios: [2024, 2024]
    unidad_plan: mujer
    unidad_archivo: persona_del_hogar
    tabla_base: RECH5
    peso: {variable: HV005, en: RECH0}
    cita: >-
      Decisión del dueño C-M1-07-1 (13/11/2026): RECH5 es una medición del cuestionario del hogar, igual que la del niño. Ficha técnica ENDES 2024 (recurso endes-2024-ficha-tecnica), §5.2 p. 9
      «A. Cuestionario del Hogar … Registro de la medición antropométrica (peso y talla) en niños menores de 6 años y mujeres de 12 a 49 años» y «Registro de los niveles de hemoglobina niños de 4
      meses a menores de 6 años y mujeres de 12 a 49 años»; §VI p. 11 «Factor Hogar (HV005) … se encuentra en el módulo RECH0». La ficha no nombra el peso de las mujeres medidas: se comprobó con la anemia
      de las mujeres de 15 a 49 años (OMS 2024), 26,02 % con HV005 (30 290 casos) frente al 26,0 % del INEI (informe principal ENDES 2024, p. 33; control tests/inferencia/recetas_control/control_anemia_mujeres.yaml).
      La mujer medida es una persona del hogar para el índice (persona_del_hogar) y una mujer para el plan
