# Universos analíticos de la ENDES 2024 (M0-06, tarea 2; diseño §7.4 y anexo A).
# Los copia una persona de curados/capa0/definiciones_endes.yaml y src/pap/capa0/encuestas.py (líneas exactas en `fuente`);
# las pruebas (tests/inferencia/test_tablas_curadas.py) los aplican a los Parquet de 2024 y exigen 9 959 casos (anemia, los dos
# criterios) y 19 511 (DCI) sobre 20 290 niños. El orden de `predicados` no cambia el resultado: todos se cumplen a la vez.
# Vocabulario de `op`: `en` (el valor está en la lista) y `entre` (lista de dos valores, límites incluidos).
# `aplica_a.archivos`: archivos de donde salen las variables; RECH6 se une a RECH1 por (HHID, HC0 = HVIDX), uno a uno
# (relación declarada en curados/inferencia/archivos_endes_2024.yaml). Un valor nulo no cumple ningún predicado.
# `anios`: M0 solo tiene 2024; M2 los extiende.
# `exige_pareja` (M1-01): el registro de la unidad debe tener su pareja en otro archivo; los que no la tienen quedan fuera. No es un
# predicado de valor; lo compilará el verificador cuando M1-07 declare la unión (hijo_de_mujer → mujer).
# M1-07 (tarea 3, versión 0.3.0): universos de las demás unidades del lote (hogar, persona, mujer y el hijo de la entrevistada). El verificador solo
# considera los universos cuyos `aplica_a.archivos` incluyen las tablas del plan que son de la unidad (curados/inferencia/unidades.yaml). Entre
# varios, vale la regla de siempre: el contenido en todos los demás (el de menos predicados); una receta puede nombrar cualquiera. «Entrevistada» =
# entrevista individual completa (V015 = 1, 34 252 de 37 117 mujeres). «Nacidos en los últimos 5 años» no es un predicado: REC41, REC43, REC44, REC94 y
# REC95 ya son solo esos nacimientos (19 751), **vivos o fallecidos** (169 tienen B5 = 0 en REC21; la cesárea del INEI los cuenta).
# Versión 0.4.0 (13/11/2026, resoluciones del dueño C-M1-07-1, -2 y -3):
# - **15 a 49 años por defecto** (C-M1-07-3 b): `mujer_15_49_entrevistada` y `nino_hijo_de_entrevistada` (el hijo de la mujer de 15 a 49) son los que elige
#   el verificador; los de 12 a 49 (`mujer_12_49_entrevistada`, `nino_hijo_de_entrevistada_12_49`) llevan `solo_por_nombre: true`: solo valen cuando una
#   receta o la pregunta los nombra. Sustento: INEI, «Perú: Encuesta Demográfica y de Salud Familiar 2024. Nacional y Departamental» (recurso
#   endes-2024-informe-principal), Presentación, p. 3 del PDF («el análisis … está basado principalmente en la población de mujeres de 15 a 49 años de edad,
#   no obstante, en algunos indicadores principales se ha incluido a las mujeres de 12 a 14 años»).
# - **El niño vivo** (C-M1-07-2): `nino_vivo_hijo_de_entrevistada` (B5 = 1, de REC21). Lo elige el verificador cuando el plan usa una variable de la batería
#   `nino_vivo` de mediciones.yaml (vacunas, diarrea, fiebre y tos, suplementos, desarrollo infantil temprano y lactancia); la cesárea y lo demás del parto
#   siguen con todos los nacimientos. REC21 solo sirve de puente (unidades.yaml, `solo_puente`).
# - **REC44 con el pernocte del niño** (C-M1-07-3 a): todo universo que cubre REC44 exige HV103 = 1 de la fila del niño en RECH1 (REC44 → REC21 → RECH1 por
#   B16 = HVIDX). Los 251 niños de REC44 con B16 = 0 o nulo (82 y 169) no tienen pareja en RECH1 y quedan **fuera del universo**, no como pérdida de la unión;
#   de los 19 751, 19 500 encuentran a su niño en RECH1 y 19 429 durmieron en el hogar (HV103 = 1).
# - **RECH5** (C-M1-07-1): la mujer de 15 a 49 años de hecho (HV103 = 1 de su fila en RECH1 por HA0 = HVIDX) y, para la hemoglobina, medida (HA55 = 0).
version: 0.4.0
fecha: "2026-11-13"
universos:
  - id: nino_hecho
    encuesta: ENDES
    unidad: nino
    aplica_a: {archivos: [RECH6, RECH1], mediciones: [hemoglobina, talla]}
    predicados:
      - {var: HV103, op: en, valores: [1]}
    anios: [2024, 2024]
    fuente: >-
      Población de hecho (durmió en el hogar la noche anterior): curados/capa0/definiciones_endes.yaml:20 («pernocto: true»
      = HV103 = 1), :27 y :34; src/pap/capa0/encuestas.py:146 («pernocto» = HV103 == 1) y :225-226 (se exige en el universo);
      Ficha técnica ENDES 2024, §II p. 2 («…y aquellas que no siendo residentes pernoctaron en la vivienda la noche
      anterior»). Ojo: §5.1 p. 8 define otra población (excluye a los visitantes que pernoctaron); HV103 = 1 los incluye,
      como el cubo validado (revisión del auditor-agente, H-1)
