# Parámetros del motor de inferencia (docs/diseno/motor_inferencia.md, anexo B). Ningún valor se fija en el código
# (agents.md §6). Cada valor dice de dónde viene, como en curados/motor/parametros_motor.yaml:
#   decision: <ID de docs/decisiones.md>   → no se cambia sin decisión del dueño
#   supuesto: <historia>                   → default de diseño, revisable; se lista en consultas_al_dueno.md
version: 0.1.0
fecha: "2026-11-09"

almacen:
  # Apertura segura de los ZIP (M0-00b, control C7; src/pap/zip_seguro.py). El margen es sobre lo más grande que hay
  # registrado el 9/11/2026: un ZIP del SIEN de 89,6 MB con 732 MB descomprimidos, un miembro de 54 MB
  # (RECH1_2024.dta) y una proporción de compresión máxima de 28,3 (RECH1 de la ENDES). Una bomba de compresión
  # pasa de 1 000.
  zip_max_miembro_mb: {valor: 1024, supuesto: M0-00b}
  zip_max_total_mb: {valor: 2048, supuesto: M0-00b}
  zip_proporcion_max: {valor: 100, supuesto: M0-00b}
  zip_proporcion_desde_mb: {valor: 1, supuesto: M0-00b}   # la proporción solo se mira en miembros de 1 MB o más
  zip_bloque_kb: {valor: 1024, supuesto: M0-00b}           # tamaño de cada bloque de lectura

  # Respaldo de los crudos (M0-02, F-03; docs/diseno/motor_inferencia.md anexo B). El repo principal es público y nunca recibe crudos.
  repo_crudos: {valor: "LaurenteEber/preguntale-al-peru-crudos", decision: F-03}
  # Al cerrar cada fase, o antes si el espacio libre baja de este valor, se respalda y se liberan los crudos locales (§6).
  espacio_libre_min_gb: {valor: 50, decision: F-03}

seguridad:
  # Prueba del lock (M0-00b, control C2; tests/test_lock_seguro.py): ningún paquete con menos de estos días de publicado.
  lock_dias_min: {valor: 14, supuesto: M0-00b}
  # Excepciones registradas a esa regla (paquete==versión, con motivo y fecha). Vacío: no hay ninguna.
  lock_excepciones: []

conversion:
  # Conversor de microdatos (M0-04; diseño §6 y tecnologias.md §5). Cada SAV/DTA se lee en un subproceso con estos topes (C8).
  # Límite de espacio de direcciones del subproceso (RLIMIT_AS). En macOS el sistema no lo hace cumplir: el conversor lo
  # detecta (manifiesto: rlimit_as_aplicado) y el tope real de memoria allí es el vigilante de RSS de abajo.
  lector_as_mb: {valor: 12288, supuesto: M0-04}
  lector_cpu_s: {valor: 900, supuesto: M0-04}           # RLIMIT_CPU: segundos de procesador del subproceso
  lector_tiempo_s: {valor: 1800, supuesto: M0-04}       # tiempo de pared por archivo; pasado esto se mata el subproceso
  lector_rss_max_mb: {valor: 3072, supuesto: M0-04}     # vigilante de memoria residente (se sondea cada lector_sondeo_s)
  lector_sondeo_s: {valor: 0.2, supuesto: M0-04}
  # Criterios de aceptación de M0-04 (se miden y se informan; no frenan la conversión).
  criterio_rss_max_mb: {valor: 1536, supuesto: M0-04}   # «RSS máximo por archivo < 1,5 GB»
  criterio_huella_s: {valor: 5, supuesto: M0-04}        # «huella de contenido en < 5 s por archivo»
  # Lectura por bloques (tecnologias.md §5): los archivos de más de 200 MB, de 25 000 en 25 000 filas.
  bloques_desde_mb: {valor: 200, supuesto: M0-04}
  bloques_filas: {valor: 25000, supuesto: M0-04}
  # DTA anteriores al formato 118 no declaran su codificación (tecnologias.md §5).
  dta_codificacion_sin_declarar: {valor: "WINDOWS-1252", supuesto: M0-04}
  # Escritura Parquet (tecnologias.md §5): DuckDB COPY, un archivo por encuesta, año y archivo.
  parquet_compresion: {valor: zstd, supuesto: M0-04}
  parquet_nivel: {valor: 3, supuesto: M0-04}
  parquet_grupo_filas: {valor: 122880, supuesto: M0-04}
  duckdb_memoria_mb: {valor: 1024, supuesto: M0-04}     # memory_limit de DuckDB dentro del subproceso
  # Nombre del archivo Parquet: miembro sin extensión, sin el sufijo _<año> y con «_» en vez de espacios (RECH0_2024.dta → RECH0).
  nombre_parquet_espacio: {valor: "_", supuesto: M0-04}
