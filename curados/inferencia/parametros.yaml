# Parámetros del motor de inferencia (docs/diseno/motor_inferencia.md, anexo B). Ningún valor se fija en el código
# (agents.md §6). Cada valor dice de dónde viene, como en curados/motor/parametros_motor.yaml:
#   decision: <ID de docs/decisiones.md>   → no se cambia sin decisión del dueño
#   supuesto: <historia>                   → default de diseño, revisable; se lista en consultas_al_dueno.md
version: 0.1.0
fecha: "2026-11-09"

almacen:
  # Apertura segura de los ZIP (M0-00b, control C7; src/pap/zip_seguro.py). El margen es sobre lo más grande que hay
  # registrado el 9/11/2026: un ZIP del SIEN de 89,6 MB con 732 MB descomprimidos, un miembro de 54 MB
  # (RECH1_2024.dta) y una proporción de compresión máxima de 28,3 (RECH1 de la ENDES). Una bomba de compresión
  # pasa de 1 000.
  zip_max_miembro_mb: {valor: 1024, supuesto: M0-00b}
  zip_max_total_mb: {valor: 2048, supuesto: M0-00b}
  zip_proporcion_max: {valor: 100, supuesto: M0-00b}
  zip_proporcion_desde_mb: {valor: 1, supuesto: M0-00b}   # la proporción solo se mira en miembros de 1 MB o más
  zip_bloque_kb: {valor: 1024, supuesto: M0-00b}           # tamaño de cada bloque de lectura

  # Tope de F-04 para la ENDES 2015–2025 (M1-01; C-M0-11-1, dueño, 12/11/2026): si un bloque lo pasa, se detiene y se consulta al dueño.
  tope_endes_mac_gb: {valor: 2, decision: "F-04 / C-M0-11-1 (dueño, 12/11/2026): 2 GB en el Mac para la ENDES 2015–2025"}
  tope_endes_repo_privado_gb: {valor: 1.5, decision: "F-04 / C-M0-11-1 (dueño, 12/11/2026): 1,5 GB en el repo privado de crudos para la ENDES 2015–2025"}

  # Respaldo de los crudos (M0-02, F-03; docs/diseno/motor_inferencia.md anexo B). El repo principal es público y nunca recibe crudos.
  repo_crudos: {valor: "LaurenteEber/preguntale-al-peru-crudos", decision: F-03}
  # Al cerrar cada fase, o antes si el espacio libre baja de este valor, se respalda y se liberan los crudos locales (§6).
  espacio_libre_min_gb: {valor: 50, decision: F-03}

seguridad:
  # Prueba del lock (M0-00b, control C2; tests/test_lock_seguro.py): ningún paquete con menos de estos días de publicado.
  lock_dias_min: {valor: 14, supuesto: M0-00b}
  # Excepciones registradas a esa regla (paquete==versión, con motivo y fecha). Vacío: no hay ninguna.
  lock_excepciones: []

conversion:
  # Conversor de microdatos (M0-04; diseño §6 y tecnologias.md §5). Cada SAV/DTA se lee en un subproceso con estos topes (C8).
  # Límite de espacio de direcciones del subproceso (RLIMIT_AS). En macOS el sistema no lo hace cumplir: el conversor lo
  # detecta (manifiesto: rlimit_as_aplicado) y el tope real de memoria allí es el vigilante de RSS de abajo.
  lector_as_mb: {valor: 12288, supuesto: M0-04}
  lector_cpu_s: {valor: 900, supuesto: M0-04}           # RLIMIT_CPU: segundos de procesador del subproceso
  lector_tiempo_s: {valor: 1800, supuesto: M0-04}       # tiempo de pared por archivo; pasado esto se mata el subproceso
  lector_rss_max_mb: {valor: 3072, supuesto: M0-04}     # vigilante de memoria residente (se sondea cada lector_sondeo_s)
  lector_sondeo_s: {valor: 0.2, supuesto: M0-04}
  # Criterios de aceptación de M0-04 (se miden y se informan; no frenan la conversión).
  criterio_rss_max_mb: {valor: 1536, supuesto: M0-04}   # «RSS máximo por archivo < 1,5 GB»
  criterio_huella_s: {valor: 5, supuesto: M0-04}        # «huella de contenido en < 5 s por archivo»
  # Lectura por bloques (tecnologias.md §5): los archivos de más de 200 MB, de 25 000 en 25 000 filas.
  bloques_desde_mb: {valor: 200, supuesto: M0-04}
  bloques_filas: {valor: 25000, supuesto: M0-04}
  # DTA anteriores al formato 118 no declaran su codificación (tecnologias.md §5).
  dta_codificacion_sin_declarar: {valor: "WINDOWS-1252", supuesto: M0-04}
  # Escritura Parquet (tecnologias.md §5): DuckDB COPY, un archivo por encuesta, año y archivo.
  parquet_compresion: {valor: zstd, supuesto: M0-04}
  parquet_nivel: {valor: 3, supuesto: M0-04}
  parquet_grupo_filas: {valor: 122880, supuesto: M0-04}
  duckdb_memoria_mb: {valor: 1024, supuesto: M0-04}     # memory_limit de DuckDB dentro del subproceso
  # Nombre del archivo Parquet: miembro sin extensión, sin el sufijo _<año> y con «_» en vez de espacios (RECH0_2024.dta → RECH0).
  nombre_parquet_espacio: {valor: "_", supuesto: M0-04}

indice:
  # Índice de variables (M0-05; diseño §7.1–7.3). Todo lo que se propone queda en `propuesto`/`revisión`: lo confirma M1.
  # Códigos especiales propuestos por la etiqueta (además de los que declara el archivo): el texto normalizado de la
  # etiqueta (minúsculas, sin acentos) contiene alguno de estos, o el código es uno de la lista y tiene etiqueta.
  especiales_textos: {valor: ["no sabe", "no responde", "no aplica"], supuesto: M0-05}
  # Historia: «98 y 99 con etiqueta». Diseño §7.2 agrega 9996–9999 (y 998/999 son los equivalentes de 3 dígitos).
  especiales_codigos: {valor: [98, 99, 998, 999, 9996, 9997, 9998, 9999], supuesto: M0-05}
  # Control del universo contra los datos (diseño §7.3): coincidencia mínima entre el universo declarado y las filas con valor.
  universo_coincidencia_min: {valor: 0.995, supuesto: M0-05}
  # Control de frecuencia de un código especial entre años: salta si la proporción de filas con ese código cambia por un
  # factor de al menos `razon` Y por al menos `cambio_min_pp` puntos porcentuales (para no marcar códigos rarísimos).
  frecuencia_especial_razon: {valor: 2.0, supuesto: M0-05}
  frecuencia_especial_cambio_min_pp: {valor: 1.0, supuesto: M0-05}
  # Etiquetas con vocal de acento grave (à è ì ò ù): no existen en español; en la ENDES 2024 son erratas del INEI («querìa», «màs»),
  # no mojibake. No se corrigen solas: se marcan para revisión (`controles`).
  vocales_acento_grave: {valor: "àèìòù", supuesto: M0-05}
  # Stata corta las etiquetas de variable en 80 caracteres: una de exactamente ese largo puede estar cortada.
  etiqueta_largo_posible_corte: {valor: 80, supuesto: M0-05}

verificador:
  # Verificador base (M0-07; diseño §12.1 y anexo B). El resto del §12.1 (sujeto, ventana, quiebres, cortes_max…) va en M1.
  # Anexo B: «se mide en la fase 0» (M0-08 lo mide con el ejecutor); mientras tanto, el valor inicial del anexo.
  dominios_max_llamada: {valor: 100, supuesto: M0-07}
  anios_apilados_max_llamada: {valor: 4, supuesto: M0-07}
  # §12.1: «una pérdida mayor al 1 % [de filas de u al unir] es falla».
  union_perdida_max: {valor: 0.01, supuesto: M0-07}
  # §12.1: «hasta la fase 3, solo proporciones».
  medidas_disponibles: {valor: [proporcion], supuesto: M0-07}
  # Un nivel fuera de inferencia_verificada sube al que lo contiene (R-ENC-06). Los dos ámbitos de Lima están dentro del
  # departamento 15 (territorios.yaml: HV024 = 15); los demás niveles suben por NIVEL_RANK (provincia, departamento, nacional).
  contencion_territorial:
    valor:
      LIMA_METROPOLITANA: {nivel: departamento, id: "15"}
      LIMA_REGION: {nivel: departamento, id: "15"}
    supuesto: M0-07
  # Nombre de la fuente en catalogo/inferencia_verificada.csv.
  fuente_inferencia_verificada: {valor: {ENDES: INEI-ENDES, ENAHO: INEI-ENAHO}, supuesto: M0-07}
  # Categoría de un corte sin dato (§12.1: «un corte sin dato pasa a la categoría “sin dato”»).
  corte_sin_dato: {valor: "sin dato", supuesto: M0-07}

duckdb:
  # Conexión endurecida (M0-07; diseño §22). Memoria = memoria_trabajador_mb del anexo B.
  memoria_mb: {valor: 1536, supuesto: M0-07}
  threads: {valor: 2, supuesto: M0-07}
  # Carpetas desde las que DuckDB puede leer, relativas a la raíz del repositorio.
  carpetas_permitidas: {valor: [biblioteca/microdatos, biblioteca/variables], supuesto: M0-07}

ejecutor:
  # Pool de procesos del ejecutor (M0-08; diseño §14 y tecnologias.md §4). Los cinco primeros son los valores iniciales del anexo B
  # («se mide en la fase 0»); M0-08 los mide en backlog/slice-m0/evidencia/m0-08_tiempos.md. `dominios_max_llamada` y
  # `anios_apilados_max_llamada` siguen en `verificador.*` (M0-07).
  ejecutor_timeout_s: {valor: 5, supuesto: M0-08}          # tiempo suave: signal.alarm dentro del trabajador
  ejecutor_gracia_s: {valor: 2, supuesto: M0-08}           # tiempo duro = timeout + gracia: el padre mata al trabajador y recrea el pool
  memoria_trabajador_mb: {valor: 1536, supuesto: M0-08}    # vigía: os._exit(137) si ru_maxrss pasa de esto (bytes en macOS, KiB en Linux)
  max_tareas_por_trabajador: {valor: 200, supuesto: M0-08} # tecnologias.md §4: max_tasks_per_child
  trabajadores: {valor: 1, supuesto: M0-08}                # M0 no atiende concurrencia; el valor de la web (mín(núcleos − 1, 4)) es de curados/web
  duckdb_threads: {valor: 1, supuesto: M0-08}              # tecnologias.md §4: threads=1 por trabajador; M0-11 midió 1 frente a 2 hilos sin diferencia (evidencia/m0-11_medicion.md)
  duckdb_memoria_mb: {valor: 512, supuesto: M0-08}         # tecnologias.md §4: memory_limit=512MB por trabajador
  vigia_sondeo_s: {valor: 0.05, supuesto: M0-08}           # cada cuánto el hilo vigía mira ru_maxrss
  arranque_max_s: {valor: 60, supuesto: M0-08}             # tope del precalentamiento (importar svy y abrir DuckDB); no cuenta contra el tiempo del cálculo

verificador_r:
  # Verificador en R (M0-09; docs/diseno/tecnologias.md §3). Instantánea de CRAN en Posit Package Manager: la fecha más reciente con al menos
  # 14 días de antigüedad (seguridad.lock_dias_min) el 9/11/2026 que trae renv 1.3.1, nanoparquet 0.5.2 y survey. Está en verificador_r/renv.lock.
  cran_instantanea: {valor: "2026-10-26", supuesto: M0-09}
  # R 4.6.2 salió el 29/10/2026: tenía 11 días el 9/11/2026, menos de los 14 de seguridad.lock_dias_min. Excepción decidida por el
  # dueño (9/11/2026) para avanzar; se revisa al subir R.
  r_version: {valor: "4.6.2", fecha_publicacion: "2026-10-29", excepcion_lock_dias_min: true, supuesto: M0-09}
  # La última de CRAN a esa fecha. La 4.5-2 (corrección del ee sobreestimado) no está publicada; ver backlog/slice-m0/evidencia/m0-09_r.md.
  survey_version: {valor: "4.5", supuesto: M0-09}
  # M0-03/M0-09: svy debe coincidir con R en est, ee e IC; gl y n exactos. Nunca se afloja para que una prueba pase.
  tolerancia_svy_vs_r: {valor: 1.0e-9, supuesto: M0-09}

compuertas:
  # Compuertas de proporciones (M0-09; diseño §15.1 y §15.2). Los umbrales viven en reglas/reglas.json (R-ENC-02, 03, 04 y 19); aquí solo lo que el diseño deja abierto.
  # Paso 8 (R-ENC-19, tasa de no respuesta del ítem): aprobado por el dueño el 12/11/2026 (K-07), con 5 % (aviso) y 20 % (referencial)
  # como valores iniciales. Lo lee `pap.inferencia.compuertas.paso_no_respuesta_activo()`; en false, la tasa solo se informa.
  paso_no_respuesta_activo: {valor: true, decision: "K-07 (dueño, 12/11/2026)"}
  # El §15.2 no dice qué confianza lleva una cifra publicable de una receta sin verificar: ante la duda, la más baja.
  confianza_receta_no_verificada: {valor: baja, supuesto: M0-09}

recetas:
  # Recetas de indicador (M0-10; src/pap/inferencia/recetas.py). Son los criterios del punto 1 de la definición de hecho de M0
  # (backlog/slice-m0/README.md) para comparar una receta con el cubo; nunca se aflojan para que una prueba pase.
  cubo_decimales: {valor: 8, supuesto: M0-10}               # el cubo guarda 8 decimales (calculo.DECIMALES)
  cubo_tolerancia_unidades: {valor: 1, supuesto: M0-10}     # |dif| ≤ 1 unidad del último decimal = 1e-8, ya redondeado
  oraculo_tolerancia: {valor: 1.0e-12, supuesto: M0-10}     # sin redondear, contra calculo._svy_niveles

# M1-00 (tarea 10): parámetros de las etapas nuevas de M1, con el valor inicial del diseño (§26, tabla de parámetros).
# Los que dicen «se mide en la fase 1» se ajustan con lo que midan M1-10, M1-17 y M1-19.
recuperador:
  candidatos_max: {valor: 20, supuesto: "diseño §26 (agente, tipo B)"}

planificador:
  muestras: {valor: 3, supuesto: "diseño §26; se mide en M1-19"}
  modelo: {valor: claude-sonnet-5-5, decision: P-07}
  esfuerzo: {valor: bajo, decision: P-07}
  max_tokens: {valor: 800, supuesto: "diseño §26; se mide en M1-10"}
  plazo_s: {valor: 9, supuesto: "diseño §26; se mide en M1-10"}

aclaracion:
  rondas_max: {valor: 2, supuesto: "diseño §26 (lo fija el dueño)"}
  plan_max_opciones: {valor: 3, supuesto: "diseño §26 (lo fija el dueño)"}

comparacion:
  diferencia_material_pp: {valor: 2, supuesto: "diseño §26 (lo fija el dueño)"}
  diferencia_material_rel: {valor: 0.10, supuesto: "diseño §26 (lo fija el dueño)"}

alternativas:
  anio_max_distancia: {valor: 3, supuesto: "diseño §26 (lo fija el dueño)"}

cache:
  planes_horas: {valor: 24, decision: P-03}

batch:
  tope_lote_usd: {valor: 20, decision: "K-05 (dueño, 12/11/2026: US$ 20 por lote de enriquecimiento)", nota: "tope propio de los lotes: no cuenta contra el de US$ 5 por día de las llamadas del servicio web (curados/web/parametros.yaml, limites.tope_llm_usd_dia; aclarado por el dueño el 13/11/2026, supuesto M1-04-s1)"}
  # Batch API (M1-04; auditoría backlog/slice-m1/evidencia/auditoria_batch_api.md: clave y Workspace aparte, lotes borrados al bajar los resultados).
  # La clave NUNCA es la del servicio web (`interprete.variable_clave`): el cliente de lotes se niega a correr si las dos variables se llaman igual.
  variable_clave: {valor: PAP_ANTHROPIC_BATCH_KEY, supuesto: M1-04, nota: "nombre propio para la clave del Workspace de lotes (auditoría de la Batch API, condición 1). La crea el dueño en la consola de Anthropic; no existe en el repo ni en el entorno hasta que la ponga"}
  api_url: {valor: "https://api.anthropic.com/v1/messages/batches", supuesto: M1-04}
  descuento: {valor: 0.5, supuesto: M1-04, nota: "la Batch API cobra 50 % de los precios base (docs/diseno/tecnologias.md §8); se aplica a los precios de `interprete.precios_usd_por_millon`"}
  tokens_por_caracter: {valor: 0.65, supuesto: M1-04, nota: "para estimar el costo máximo antes de crear el lote. Medido en vivo el 13/11/2026 (lote de RECH6, REC43 y REC0111): 1 038 426 tokens de entrada para 1 791 145 caracteres = 0,58 tokens por carácter; con 0,45 el costo real de la pasada de vincular (US$ 1,10) pasó el máximo estimado (US$ 0,89). Se usa 0,65 para que el máximo vuelva a ser un techo"}
  sondeo_s: {valor: 60, supuesto: M1-04}                 # segundos entre dos consultas de estado
  espera_max_s: {valor: 90000, supuesto: M1-04}          # un lote vence a las 24 h; pasado esto se deja de esperar (el estado queda guardado)
  max_tokens_vincular: {valor: 60, supuesto: M1-04}
  max_tokens_verificar: {valor: 120, supuesto: M1-04}
  salida_estructurada: {valor: false, supuesto: M1-04, nota: "no probada en vivo con lotes (la del intérprete tampoco: interprete.salida_estructurada es false). Los esquemas de lote son de un solo campo; con false se pide el JSON en el texto y `leer_json` lo lee"}
  opciones_en_prompt: {valor: 8, supuesto: M1-04}        # opciones de respuesta de cada pregunta candidata que se muestran al LLM

inferencia:
  # Variables en estado `propuesto` (M1-01; se deriva de K-04). Con `true`, el motor en sombra admite variables `propuesto` mientras el visto del
  # dueño a las `revisado` espera (3 horas por semana: no frenan el trabajo). Nunca con `motor.version: nuevo` (curados/motor/parametros_motor.yaml):
  # la web no responde con variables sin revisar.
  admitir_propuesto_en_sombra: {valor: true, decision: "K-04 (dueño, 12/11/2026): lo que espera un visto queda en `propuesto` o `revisado` y el trabajo sigue; solo en modo sombra"}

cuestionarios:
  # Texto de los cuestionarios y diccionarios de la ENDES (M1-04; diseño §7.2, tecnologias.md §6). El diseño de los PDF del INEI
  # varía entre cuestionarios y páginas, así que el lector se guía por la posición de las palabras; estos valores son los de los
  # PDF de 2024 (medidos el 12/11/2026) y se cambian aquí, no en el código.
  numero_patron: {valor: '^[1-9]\d{0,3}([A-Z]\d?)?$', supuesto: M1-04}   # 325, 325B, 478F1, 1012A (la sección 10 del individual va de 1000 a 1043); sin ceros a la izquierda (las filas de las matrices son 01, 02…)
  numero_x_max: {valor: 70, supuesto: M1-04}                # el número de pregunta está en la columna izquierda (puntos desde el borde)
  numero_tolerancia: {valor: 9, supuesto: M1-04}            # cuánto puede alejarse un número de la columna de su página
  texto_margen: {valor: 8, supuesto: M1-04}                 # el texto empieza al menos esto a la derecha del número
  linea_tolerancia_y: {valor: 2.5, supuesto: M1-04}         # palabras a esta altura (puntos) son de la misma línea
  categorias_x_defecto_prop: {valor: 0.5, supuesto: M1-04}  # sin guías en la página, las categorías empiezan a esta fracción del ancho
  categorias_margen: {valor: 20, supuesto: M1-04}           # las categorías pueden empezar hasta esto antes de la primera guía
  salto_x_defecto_prop: {valor: 0.9, supuesto: M1-04}       # columna «PASE A» sin encabezado en la página
  texto_max_caracteres: {valor: 1500, supuesto: M1-04}      # tope del texto de una pregunta (una matriz larga se corta, con aviso)
  opciones_max: {valor: 60, supuesto: M1-04}
  seccion_patron: {valor: '^SECCI[ÓO]N\b', supuesto: M1-04}
  # Páginas sin encabezado «SECCIÓN» que no son de la sección anterior (medidas en los PDF de 2024 el 13/11/2026; corrección de M1-04
  # tras la revisión de M1-06, supuesto M1-06-s7). Tipo «anexo»: sus preguntas se extraen con esta sección. Tipo «calendario»: una
  # entrada por página con su texto, para vincular el calendario de la mujer (REC82) a nivel de página.
  paginas_especiales:
    valor:
      - {cuestionario: individual, desde: 82, hasta: 84, tipo: anexo, seccion: "ANEXO. FECHAS DE VACUNACIÓN COPIADAS DEL CARNÉ (PREGUNTAS 456 A 466E)"}
      - {cuestionario: individual, desde: 89, hasta: 90, tipo: calendario, seccion: "CALENDARIO"}
    supuesto: M1-04
  # Vínculo variable ↔ pregunta sin LLM (M1-04, tarea 3). Una regla dice en qué cuestionario está la pregunta y cómo sacar su
  # número del código de la variable (QS25C1 → 25C1, 25C, 25: se usa el más largo que exista). Solo valen los números que existen en
  # ese cuestionario. Son hechos del esquema de nombres de 2024 (medidos el 12/11/2026), revisables aquí.
  reglas_codigo:
    valor:
      - {id: salud, cuestionario: salud, tablas: [CSALUD01, CSALUD08], regex: '^QS(\d{1,3}[A-Z_0-9]*)'}
      - {id: individual_q, cuestionario: individual, tablas: ["*"], regex: '^QD?(\d{3,4}[A-Z_0-9]*)'}
    supuesto: M1-04
  # Dónde se busca el número de pregunta en la etiqueta del diccionario («… (pregunta 105)»).
  etiqueta_pregunta_patron: {valor: '\b(?:pregunta|preg\.?)\s*(\d{1,3}[A-Z]?\d?)\b', supuesto: M1-04}
  # Variables sin pregunta y por qué (M1-04, tarea 6): administrativa (identificadores, pesos, diseño de la muestra) o construida
  # (la calcula el INEI a partir de otras). Se reconocen por el código o por la etiqueta; el resto, si el LLM no encuentra pregunta,
  # queda `no_encontrada`.
  sin_pregunta:
    valor:
