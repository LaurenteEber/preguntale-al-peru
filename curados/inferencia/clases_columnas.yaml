# Clases de columna de la ENDES 2024 (M0-04 las usa para convertir; M0-05 las completa y las lleva al índice de variables).
# Clases (docs/diseno/motor_inferencia.md §6 y §7.2):
#   llave, geo → texto; se recortan los espacios de los extremos (no los internos) y se verifica el `ancho`: un ancho
#                distinto es un error, nunca se corta. Un valor nulo queda nulo.
#   categoria, diseno → INTEGER (un valor con decimales o fuera de INTEGER es un error)
#   medida, peso      → DOUBLE
# `clase_indice`: la clase que lleva el índice cuando la columna se guarda con otra (p. ej. HVIDX es un número de línea:
#                 se guarda como INTEGER pero es una llave del archivo; HV025 es el área, un dato de ubicación).
# `deriva`: columna que se calcula del valor CRUDO de esta (antes de recortar). `quitar_final: n` quita los n últimos
#           caracteres (CASEID = HHID + número de línea de 3 caracteres, con espacios). Si el archivo ya trae la columna
#           derivada, se compara y una diferencia es un error; si no la trae, se agrega.
# `cita`: clave de `citas` (abajo): de dónde sale que la columna es de esa clase. Prueba: tests/inferencia/test_clases_columnas.py.
# Lo que no está aquí: texto → VARCHAR tal cual; numérico (o toda nula) → DOUBLE; fechas → se conservan.
version: 0.2.0
provisional: false
fecha: "2026-11-09"
citas:
  ficha_hogar: >-
    Ficha técnica ENDES 2024, INEI (recurso endes-2024-ficha-tecnica; PDF «2024-5-FichaTecnica.pdf»), §VI «Factores de
    ponderación», pp. 10–11: «Factor Hogar (HV005) … HV001: conglomerado, HV022: estrato, peso=HV005/1000000»; «El factor
    hogar (HV005) se encuentra en el módulo RECH0».
  ficha_mujer: >-
    Ficha técnica ENDES 2024, INEI (recurso endes-2024-ficha-tecnica), §VI, p. 11: «Factor Mujer (V005) … V001:
    conglomerado, V022: estrato, peso=V005/1000000»; «El factor mujer (V005) se encuentra en el módulo REC0111».
  ficha_salud15: >-
    Ficha técnica ENDES 2024, INEI (recurso endes-2024-ficha-tecnica), §VI, p. 11: «Para personas de 15 años a más
    (PESO15_AMAS) … qhcluster: conglomerado, HV022: estrato, peso= PESO15_AMAS /1000000»; «se encuentra en el módulo CSALUD01».
  ficha_men12: >-
    Ficha técnica ENDES 2024, INEI (recurso endes-2024-ficha-tecnica), §VI, p. 11: «Para niños menores de 12
    (Pesomen12) … qhcluster: conglomerado, HV022: estrato, peso= Pesomen12 /1000000»; «se encuentra en el módulo CSALUD08».
  ficha_panel: >-
    Ficha técnica ENDES 2024, INEI (recurso endes-2024-ficha-tecnica), §3.1, p. 3: «Los conglomerados que tienen la misma
    numeración en la variable HV001 (conglomerado) en los años 2023 y 2024 son paneles»; y §VI, p. 10–11 (HV001: conglomerado).
  definiciones_diseno: >-
    curados/capa0/definiciones_endes.yaml, bloque `diseno` (líneas 6–10): estrato = HV024 × HV022 (E-01), conglomerado =
    HV021; src/pap/capa0/encuestas.py:113 y 137–140 (lee HV021, HV022, HV024, HV025 y UBIGEO de RECH0); etiqueta del archivo
    2024 de HV021: «Unidad de muestreo primario (conglomerado)».
  dicc_hhid: >-
    Etiqueta del archivo (DTA 2024, RECH0 y los demás módulos de hogar): «Identificación Cuestionario del Hogar»; diccionarios
    INEI de cada módulo (PDF dentro del ZIP 968-ModuloNNNN; recursos endes-2024-diccionario-*); src/pap/capa0/encuestas.py:122.
    Ancho 9 verificado en los 34 archivos de 2024 en M0-04.
  dicc_caseid: >-
    Etiqueta del archivo (DTA 2024, REC0111 y demás módulos de la mujer): «Identificación Cuestionario Individual»; CASEID =
    HHID (9) + número de línea (3), con espacios (M0-04: el HHID derivado coincide con el de REC0111 en todas las filas).
  dicc_linea: >-
    Etiqueta del archivo (DTA 2024): HVIDX «Número de Orden en el Hogar» (RECH1 y los PS_*), HC0 «Número de orden en el
    hogar» (RECH6); la unión RECH6.HC0 = RECH1.HVIDX es la que usa src/pap/capa0/encuestas.py:126 y se prueba en
    tests/inferencia/test_indice_regresion.py.
  dicc_geo: >-
    Etiqueta del archivo (DTA 2024): UBIGEO «Código de Ubicación Gegráfica» (RECH0 y REC0111; ancho 6), HV025 «Área de
    residencia» (RECH0), V025 «Tipo de lugar de residencia» (REC0111); src/pap/capa0/encuestas.py:113 y 142.
columnas:
  HHID: {clase: llave, ancho: 9, cita: dicc_hhid}
  CASEID: {clase: llave, ancho: 12, deriva: {HHID: {quitar_final: 3}}, cita: dicc_caseid}
  HVIDX: {clase: categoria, clase_indice: llave, cita: dicc_linea}
  HC0: {clase: categoria, clase_indice: llave, cita: dicc_linea}
  UBIGEO: {clase: geo, ancho: 6, cita: dicc_geo}
  HV025: {clase: categoria, clase_indice: geo, cita: dicc_geo}
  V025: {clase: categoria, clase_indice: geo, cita: dicc_geo}
  HV005: {clase: peso, cita: ficha_hogar}
  V005: {clase: peso, cita: ficha_mujer}
  PESO15_AMAS: {clase: peso, cita: ficha_salud15}
  PESOMEN12: {clase: peso, cita: ficha_men12}
  HV001: {clase: diseno, cita: ficha_panel}
  HV021: {clase: diseno, cita: definiciones_diseno}
  HV022: {clase: diseno, cita: ficha_hogar}
  HV024: {clase: diseno, cita: definiciones_diseno}
  V001: {clase: diseno, cita: ficha_mujer}
  V021: {clase: diseno, cita: ficha_mujer}
  V022: {clase: diseno, cita: ficha_mujer}
  V024: {clase: diseno, cita: ficha_mujer}
  QHCLUSTER: {clase: diseno, cita: ficha_salud15}
