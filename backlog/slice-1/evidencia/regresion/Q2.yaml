- capa: capa3.glosario[3].definicion
  antes: ''
  despues: el nivel de hemoglobina por debajo del cual se considera anemia y cómo se ajusta según la altitud. Desde 2024 el Ministerio de Salud usa una nueva (la vigente); la anterior no se compara con la de hoy.
  motivo: 'S3-01b punto 1 (H-A), aprobado por el dueño el 6/11/2026: la definición de «forma de medir la anemia» dice «la anterior no se compara con la de hoy» en vez de «la anterior da cifras más altas». Cambia solo la redacción.'
  aprobado_por: dueño
