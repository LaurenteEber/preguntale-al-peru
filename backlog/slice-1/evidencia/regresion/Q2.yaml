- capa: capa3.glosario[3].termino
  antes: ''
  despues: forma de medir la anemia
  motivo: 'H15 (S3-02, aprobada por el agente, agents.md §5.1): la respuesta usa «forma de medir vigente desde 2024» en sus citas y no tenía el término en el glosario; se agrega la entrada que ya existe en glosario.yaml (forma_de_medir), la misma que ya lleva Q1. Condiciones de §5.1: (1) no cambia ninguna cifra, semáforo, confianza ni regla de bloqueo, supresión, subida de nivel o referencial; (2) el término ya está en el texto de la respuesta y la definición es el texto fijo del glosario; (3) corrector sin infracciones y capa 1 sin cambios; (4) no cambia el orden de un «no se puede»'
  aprobado_por: agente
- capa: capa2.mas_contexto[2].texto
  antes: El INS advierte que sus cifras son de niños atendidos en establecimientos del MINSA, que no son estrictamente comparables con la ENDES y que, como no a todos los atendidos se les mide la hemoglobina, podrían subestimar la anemia real. La hemoglobina se corrigió según la altitud del distrito del establecimiento, no la del lugar de donde procede el niño.
  despues: ''
  motivo: 'S3-01b punto 4 (H-F), aprobado por el dueño el 6/11/2026: el título de la tarjeta pasa a «Por qué esta cifra no se compara con la de la encuesta» (antes decía «es más baja»). El texto de la tarjeta no cambia. La tarjeta cambia de índice porque el corrector de la regresión empareja por título.'
  aprobado_por: dueño
